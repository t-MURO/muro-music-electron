name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NEO_KEYFINDER_VERSION: "v0.1.2"
  PUBLISH_MODE: ${{ github.event_name == 'push' && 'onTagOrDraft' || 'never' }}

jobs:
  prepare_release:
    name: Prepare tagged release
    runs-on: ubuntu-24.04

    steps:
      - name: Create draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Muro Music $RELEASE_TAG"
          fi

      - name: Keep manual builds unpublished
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual workflow runs produce Actions artifacts only."

  windows:
    name: Windows x64 installer
    needs: prepare_release
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out Muro Music
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run fpcalc:prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run keyfinder:download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-packaged-resources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and publish NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/stage-packaged-resources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-packaged-resources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install electron-builder --win nsis --publish "$env:PUBLISH_MODE"

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muro-music-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    needs: prepare_release
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out Muro Music
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run fpcalc:prepare
          npm run keyfinder:download
          npx --no-install vite build
          node scripts/verify-packaged-resources.cjs

      - name: Build and publish DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/stage-packaged-resources.cjs
          node scripts/verify-packaged-resources.cjs
          npx --no-install electron-builder --mac dmg --publish "$PUBLISH_MODE"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muro-music-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
